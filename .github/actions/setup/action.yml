name: "Setup the project"
description: "Installs the pinned Node.js and pnpm versions, then the workspace dependencies from the lockfile"

runs:
  using: "composite"
  steps:
    # Reads the exact version from the root package.json `packageManager` field.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    # The pnpm store cache is keyed on the OS, architecture and pnpm-lock.yaml hash.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        registry-url: "https://registry.npmjs.org"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
