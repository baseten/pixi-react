name: Handle Release Branch Push

on:
  merge_group:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a configured fork release (false only reviews configuration)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORK_RELEASE_ENABLED: ${{ vars.FORK_RELEASE_ENABLED }}
  FORK_PREVIEW_ENABLED: ${{ vars.FORK_PREVIEW_ENABLED }}
  FORK_PACKAGE_NAME: ${{ vars.FORK_PACKAGE_NAME }}
  FORK_DOCS_ENABLED: ${{ vars.FORK_DOCS_ENABLED }}
  FORK_DOCS_REPOSITORY: ${{ vars.FORK_DOCS_REPOSITORY }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        script:
          - name: Typecheck
            command: test:types
            installPlaywright: false
          - name: Lint
            command: test:lint
            installPlaywright: false
          - name: Unit tests
            command: test:unit
            installPlaywright: false
          - name: E2E tests
            command: test:e2e
            installPlaywright: true
          - name: Docs
            command: build:docs
            installPlaywright: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check publication guards
        run: node --test .github/actions/fork-safety/check.test.cjs

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        if: ${{ matrix.script.installPlaywright }}
        run: npx playwright install

      - name: ${{ matrix.script.name }}
        run: npm run ${{ matrix.script.command }}

  review-destinations:
    name: Review publication destinations
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node .github/actions/fork-safety/check.cjs review

  preview:
    name: 'Publish: Preview'
    needs: verify
    if: ${{ vars.FORK_PREVIEW_ENABLED == 'true' && github.repository == 'baseten/pixi-react' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate fork package destination
        run: node .github/actions/fork-safety/check.cjs preview
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Publish configured fork preview
        run: npx pkg-pr-new@0.0.54 publish --no-template

  publish:
    name: 'Publish: Release'
    needs: verify
    if: ${{ vars.FORK_RELEASE_ENABLED == 'true' && github.repository == 'baseten/pixi-react' && github.event_name == 'workflow_dispatch' && inputs.publish_release && contains(fromJson('["refs/heads/alpha", "refs/heads/beta", "refs/heads/main"]'), github.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fork package destination
        run: node .github/actions/fork-safety/check.cjs release
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Publish configured fork release
        run: |
          rm -f "$NPM_CONFIG_USERCONFIG"
          npx semantic-release@24.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
