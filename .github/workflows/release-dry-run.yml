name: Release dry run

# The release dry run of design/release.md (issues 40 and 62): version, build, stage, inspect, packed consumers and
# bundle assertions in a disposable copy. It never publishes: no secrets, read-only token.
# Branch protection should require the check "Release dry run". It has no `paths` filter, so it runs on every pull
# request and never stays pending.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # `changeset status` (the policy check's release plan) compares against main.
          fetch-depth: 0
      # `changeset status` runs `git merge-base main HEAD`. A pull_request checkout is a detached merge commit with
      # only origin/main, so give it the local branch (a push to main already has one).
      - name: Local main branch for changeset status
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - uses: ./.github/actions/setup
      - name: Release tooling tests and policy
        run: pnpm test:release
      - name: Dry run (version, build, stage, inspect, consumers, bundles)
        run: node scripts/release/dry-run.mjs --work "$RUNNER_TEMP/release-dry-run"
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            ${{ runner.temp }}/release-dry-run/tarballs/*.json
            ${{ runner.temp }}/release-dry-run/tarballs/*.md
          if-no-files-found: warn
          retention-days: 14
