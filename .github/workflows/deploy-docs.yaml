name: Deploy Docs

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy configured fork docs (false builds and reviews only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORK_RELEASE_ENABLED: ${{ vars.FORK_RELEASE_ENABLED }}
  FORK_PREVIEW_ENABLED: ${{ vars.FORK_PREVIEW_ENABLED }}
  FORK_PACKAGE_NAME: ${{ vars.FORK_PACKAGE_NAME }}
  FORK_DOCS_ENABLED: ${{ vars.FORK_DOCS_ENABLED }}
  FORK_DOCS_REPOSITORY: ${{ vars.FORK_DOCS_REPOSITORY }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  review:
    name: Build and review docs destination
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node .github/actions/fork-safety/check.cjs review
      - uses: ./.github/actions/setup
      - run: pnpm run build:docs

  deploy:
    name: Deploy configured fork docs
    needs: review
    if: ${{ github.repository == 'baseten/pixi-react' && github.ref == 'refs/heads/main' && inputs.deploy && vars.FORK_DOCS_ENABLED == 'true' && vars.FORK_DOCS_REPOSITORY == 'baseten/pixi-react' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate docs destination
        run: node .github/actions/fork-safety/check.cjs docs
      - uses: ./.github/actions/setup
      # Build the workspace facade the docs depend on (workspace:*) before deploying.
      - run: pnpm run build
      - name: Deploy to this fork
        # `pnpm run deploy` (not `pnpm deploy`, a built-in pnpm command) runs the docs deploy script.
        run: pnpm run deploy
        env:
          GIT_USER: ${{ github.actor }}
          GIT_USER_NAME: ${{ github.actor }}
          GIT_USER_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_PASS: ${{ secrets.GITHUB_TOKEN }}
